<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ford Mustang Dark Horse | Global Marketing Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  </head>

  <body>
    <div class="backdrop" aria-hidden="true"></div>

    <header class="site-header site-container">
      <a class="site-brand" href="#market-title" aria-label="Janelle Gardner Mustang Dark Horse dashboard home">
        <img class="header-thumbnail" src="assets/ford-mustang-thumbnail.png" alt="Ford Mustang Dark Horse thumbnail" />
        <span>Janelle Gardner</span>
        <strong>Mustang Dark Horse Strategy · Product × Price × Brand × Channel</strong>
      </a>

    </header>

    <div class="dashboard-shell">

      <main class="main-panel">
        <p id="matrix-live-region" class="sr-only" aria-live="polite"></p>
        <section class="comparison-workspace" data-view="comparison" data-market-focus="compare" aria-labelledby="comparison-hub-title">
          <div class="workspace-market-nav">
            <p class="workspace-label">Market focus</p>
            <div role="tablist" aria-label="Market focus">
              <button type="button" role="tab" aria-selected="true" data-market-focus="compare"><i></i>Compare Markets</button>
              <button type="button" role="tab" aria-selected="false" data-market-focus="usa"><i></i>United States</button>
              <button type="button" role="tab" aria-selected="false" data-market-focus="uk"><i></i>United Kingdom</button>
              <button type="button" role="tab" aria-selected="false" data-market-focus="kuwait"><i></i>Kuwait</button>
            </div>
            <div class="workspace-mode-separator"></div>
            <button type="button" role="tab" aria-selected="false" data-market-focus="research"><i></i>Strategy &amp; Research</button>
            <button type="button" role="tab" aria-selected="false" data-market-focus="risks"><i></i>Risk, Constraints &amp; Challenges</button>
          </div>
          <div class="workspace-topic-nav">
            <p class="workspace-label">Topic</p>
            <div role="tablist" aria-label="Comparison topic">
              <button type="button" role="tab" aria-selected="true" data-comparison-category="prices"><i></i>Prices</button>
              <button type="button" role="tab" aria-selected="false" data-comparison-category="framework"><i></i>Framework</button>
              <button type="button" role="tab" aria-selected="false" data-comparison-category="diffusion"><i></i>Diffusion</button>
              <button type="button" role="tab" aria-selected="false" data-comparison-category="branding"><i></i>Branding</button>
              <button type="button" role="tab" aria-selected="false" data-comparison-category="pricingDrivers"><i></i>Pricing Drivers</button>
              <button type="button" role="tab" aria-selected="false" data-comparison-category="production"><i></i>Production</button>
              <button type="button" role="tab" aria-selected="false" data-comparison-category="imc"><i></i>IMC</button>
              <button type="button" role="tab" aria-selected="false" data-comparison-category="logistics"><i></i>Logistics</button>
              <button type="button" role="tab" aria-selected="false" data-comparison-category="conclusion"><i></i>Conclusion</button>
            </div>
            <div class="research-topic-list" role="tablist" aria-label="Strategy and research topic" hidden>
              <button type="button" role="tab" aria-selected="true" data-research-category="recommendations"><i></i>Strategic Recommendations</button>
              <button type="button" role="tab" aria-selected="false" data-research-category="framework"><i></i>Global Strategy Framework</button>
              <button type="button" role="tab" aria-selected="false" data-research-category="references"><i></i>Research &amp; References</button>
            </div>
            <div class="risk-topic-list" role="tablist" aria-label="Risk, constraints, and challenges topic" hidden>
              <button type="button" role="tab" aria-selected="true" data-risk-market="usa"><i></i>United States</button>
              <button type="button" role="tab" aria-selected="false" data-risk-market="uk"><i></i>United Kingdom</button>
              <button type="button" role="tab" aria-selected="false" data-risk-market="kuwait"><i></i>Kuwait</button>
            </div>
          </div>
          <div class="workspace-active">
            <header class="workspace-heading">
              <div><p class="section-kicker" id="workspace-focus-label">Compare Markets · Prices</p><h2 id="comparison-hub-title">See the strategic difference</h2></div>
              <p id="comparison-category-description">Comparable MSRP across five existing Dark Horse variants.</p>
            </header>
            <div class="comparison-stage">
              <div class="comparison-visual" id="comparison-visual" role="tabpanel" aria-live="polite"></div>
              <aside class="comparison-insight" id="comparison-insight" aria-live="polite"></aside>
            </div>
          </div>
        </section>
      </main>
    </div>
    <footer class="site-footer"><span>Ford Mustang Dark Horse · Global Marketing Strategy</span><small>Janelle Gardner</small></footer>
    <script src="./script.js" defer></script>
  </body>
</html>
